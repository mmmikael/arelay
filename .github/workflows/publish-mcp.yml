name: Publish to npm and MCP Registry

# Publishes @arelay/core, @arelay/cli, and @arelay/client to npm and the server
# metadata to the MCP Registry whenever a cli-v* tag is pushed (e.g. cli-v0.1.1).
# @arelay/cli and @arelay/client depend on @arelay/core, so core is published
# first; each publish is skipped when that version is already on npm, so bumping
# only the package that changed is enough. Requires the NPM_TOKEN repository
# secret; MCP Registry auth uses GitHub OIDC (no secret needed).

on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC authentication for the MCP Registry
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      # @arelay/cli type-checks against core's emitted dist during its
      # prepublishOnly build, so build core before either publish.
      - name: Build @arelay/core
        run: npm -w @arelay/core run build

      - name: Publish @arelay/core to npm
        # Skip if this version is already on npm so the run can be re-tried
        # (e.g. via workflow_dispatch) without aborting here.
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          if npm view "@arelay/core@$VERSION" version >/dev/null 2>&1; then
            echo "@arelay/core@$VERSION already published; skipping npm publish."
          else
            npm publish -w @arelay/core # prepublishOnly runs build + tests
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @arelay/cli to npm
        run: |
          VERSION=$(node -p "require('./packages/arelay/package.json').version")
          if npm view "@arelay/cli@$VERSION" version >/dev/null 2>&1; then
            echo "@arelay/cli@$VERSION already published; skipping npm publish."
          else
            npm publish -w @arelay/cli # prepublishOnly runs build + tests
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @arelay/client to npm
        run: |
          VERSION=$(node -p "require('./packages/client/package.json').version")
          if npm view "@arelay/client@$VERSION" version >/dev/null 2>&1; then
            echo "@arelay/client@$VERSION already published; skipping npm publish."
          else
            npm publish -w @arelay/client # prepublishOnly runs build + tests
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
