name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # check / test / build each build the @arelay/* workspace packages first
      # (via the build:packages script), so the portal's package imports resolve.
      - run: npm run check
      - run: npm test
      - run: npm run build

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Build core first — @arelay/cli type-checks against its emitted dist.
      - run: npm -w @arelay/core run build
      - run: npm -w @arelay/core test
      - run: npm -w @arelay/cli run build
      - run: npm -w @arelay/cli test
      - run: npm -w @arelay/client run build
      - run: npm -w @arelay/client test

  db-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_relay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Smoke test Drizzle migrations on empty database
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_relay_ci
        run: npm run db:smoke
